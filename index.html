<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon" />
    <title>Tetris</title>
  </head>
  <body>
    <h1 class="top-heading">Tetris</h1>
    <div class="game-box">
      <div class="wrapper game-wrapper">
        <canvas id="game"> </canvas>
      </div>
      <div class="game-score-box">
        <div class="wrapper">
          <canvas id="preview-window"> </canvas>
        </div>
        <div class="wrapper">
          <div id="score-window"></div>
        </div>
        <div class="controls">
          <img
            id="sound-control"
            width="40px"
            src="assets/images/volume-off.png"
            alt=""
          />
          <span id="speed-control">x2</span>
          <button id="multiplayer-button">New Room</button>
        </div>
      </div>
    </div>
    <footer>Made with Love by Sujas Aggarwal</footer>
    <script src="main.js"></script>
  </body>
</html>
